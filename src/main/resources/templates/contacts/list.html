<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Мои контакты')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="container page">
    <section class="panel">
        <div class="page-header">
            <div>
                <h1>Мои контакты</h1>
                <p class="note">Список личных контактов текущей учётной записи.</p>
            </div>
            <div class="page-actions">
                <a class="button-secondary" th:href="@{/contacts/import}">Импорт CSV</a>
                <a class="button" th:href="@{/contacts/new}">Создать контакт</a>
            </div>
        </div>

        <div th:if="${infoMessage}" class="alert alert-info" role="status" th:text="${infoMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" role="alert" th:text="${errorMessage}"></div>

        <div th:if="${#lists.isEmpty(contacts)}" class="empty-state">
            <p>У вас пока нет контактов.</p>
            <p class="note"><a th:href="@{/contacts/new}">Создайте первый контакт</a>.</p>
        </div>

        <div th:unless="${#lists.isEmpty(contacts)}" class="table-wrapper">
            <table class="contact-table">
                <thead>
                <tr>
                    <th scope="col">Фамилия</th>
                    <th scope="col">Имя</th>
                    <th scope="col">Email</th>
                    <th scope="col">Телефон</th>
                    <th scope="col">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="contact : ${contacts}">
                    <td th:text="${contact.surname}">Иванов</td>
                    <td th:text="${contact.name}">Иван</td>
                    <td>
                        <span th:if="${contact.email != null and !contact.email.isBlank()}" th:text="${contact.email}">ivan@example.com</span>
                        <span th:unless="${contact.email != null and !contact.email.isBlank()}" class="muted">—</span>
                    </td>
                    <td>
                        <span th:if="${contact.phoneNumber != null and !contact.phoneNumber.isBlank()}" th:text="${contact.phoneNumber}">+79990000000</span>
                        <span th:unless="${contact.phoneNumber != null and !contact.phoneNumber.isBlank()}" class="muted">—</span>
                    </td>
                    <td class="actions">
                        <a th:href="@{/contacts/{id}/edit(id=${contact.id})}">Редактировать</a>
                        <form th:action="@{/contacts/{id}/delete(id=${contact.id})}" method="post" class="inline-form"
                              onsubmit="return confirm('Удалить контакт?');">
                            <button type="submit" class="link-button danger">Удалить</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
