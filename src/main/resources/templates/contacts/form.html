<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${formTitle})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="container page">
    <section class="panel contact-form-panel">
        <h1 th:text="${formTitle}">Новый контакт</h1>
        <p th:if="${contactId != null}" class="note" th:text="'Контакт #' + ${contactId}">Контакт #1</p>
        <p class="note">Поля email и телефон необязательны.</p>

        <div th:if="${errorMessage}" class="alert alert-error" role="alert" th:text="${errorMessage}"></div>
        <ul th:if="${errorDetails != null and !#lists.isEmpty(errorDetails)}" class="error-list">
            <li th:each="detail : ${errorDetails}" th:text="${detail}"></li>
        </ul>

        <form th:action="@{${formAction}}" th:object="${contactForm}" method="post" class="auth-form">
            <label for="name">Имя</label>
            <input type="text" id="name" th:field="*{name}" autocomplete="given-name" required>
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <label for="surname">Фамилия</label>
            <input type="text" id="surname" th:field="*{surname}" autocomplete="family-name" required>
            <p class="field-error" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"></p>

            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="email">
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            <label for="phoneNumber">Телефон</label>
            <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" autocomplete="tel">
            <p class="field-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>

            <div class="form-actions">
                <button type="submit" class="button">Сохранить</button>
                <a class="button-secondary" th:href="@{/contacts}">Отмена</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
