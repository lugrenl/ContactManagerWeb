<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${errorTitle})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="container page">
    <nav th:replace="~{layout :: adminNav}"></nav>

    <section class="panel">
        <h1 th:text="${errorTitle}">Ошибка</h1>
        <div class="alert alert-error" role="alert" th:text="${errorMessage}">Не удалось выполнить операцию.</div>
        <ul th:if="${errorDetails != null and !#lists.isEmpty(errorDetails)}" class="error-list">
            <li th:each="detail : ${errorDetails}" th:text="${detail}"></li>
        </ul>
        <p class="form-actions">
            <a class="button" th:href="@{/admin/users}">К списку пользователей</a>
            <a class="button-secondary" th:href="@{/admin/contacts}">Все контакты</a>
        </p>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
