<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Вход')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="container page">
    <section class="auth-card">
        <h1>Вход</h1>
        <p class="note">Введите имя пользователя и пароль.</p>

        <div th:if="${infoMessage}" class="alert alert-info" role="status" th:text="${infoMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" role="alert" th:text="${errorMessage}"></div>
        <ul th:if="${errorDetails != null and !#lists.isEmpty(errorDetails)}" class="error-list">
            <li th:each="detail : ${errorDetails}" th:text="${detail}"></li>
        </ul>

        <form th:action="@{/login}" th:object="${loginForm}" method="post" class="auth-form">
            <label for="name">Имя пользователя</label>
            <input type="text" id="name" th:field="*{name}" autocomplete="username" required>
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

            <button type="submit" class="button">Войти</button>
        </form>

        <p class="note">Нет учётной записи? <a th:href="@{/register}">Зарегистрироваться</a>.</p>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
